# Amvera deploy config: build from the Dockerfile; the persistent /data mount holds the SQLite database of the online
# layer (the shared register and the box of undelivered letters). ADMIN_TOKEN (project variable) enables /admin.
meta:
  environment: docker
  toolchain:
    name: docker
    version: latest
build:
  dockerfile: Dockerfile
  skip: false
run:
  persistenceMount: /data
  containerPort: 3000
