name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm test
      - run: npm run build

  docker:
    runs-on: ubuntu-latest
    needs: check
    steps:
      - uses: actions/checkout@v4
      - name: Build production image (same Dockerfile Amvera uses)
        run: docker build -t littledarkage .
      - name: Smoke test the image
        run: |
          docker run -d --name littledarkage -p 3000:3000 littledarkage
          for i in $(seq 1 20); do curl -fs localhost:3000/api/health && break; sleep 1; done
          curl -fs localhost:3000/api/health
          curl -fs localhost:3000/ | grep -q 'Короткий тёмный век'
          curl -fs localhost:3000/proto/ | grep -q 'Прототипы вехи 1'
