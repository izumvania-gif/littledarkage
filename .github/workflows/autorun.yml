name: Autorun

# The automatic playthroughs (agent/selftest.mjs): the built game played from the intro to the finale in agent
# mode, through observe/act only. Separate from CI, so a slow or failing playthrough never blocks a deploy; it
# runs only after CI has passed on main (so its own success can never stand in for a red CI), or by hand.
on:
  workflow_run:
    workflows: [CI]
    types: [completed]
    branches: [main]
  workflow_dispatch:

jobs:
  playthrough:
    if: github.event_name == 'workflow_dispatch' || github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.workflow_run.head_sha || github.sha }}
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run build --workspace=apps/game
      - name: Install Playwright and Chromium
        working-directory: agent
        run: |
          npm install --no-audit --no-fund
          npx playwright install --with-deps chromium
      - name: Play the game through
        run: node agent/selftest.mjs --shots agent/shots
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: autorun-screenshots
          path: agent/shots/
          if-no-files-found: ignore
